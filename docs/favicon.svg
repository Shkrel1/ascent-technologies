<svg viewBox="0 0 32 32" xmlns="http://www.w3.org/2000/svg">
  <rect width="32" height="32" rx="6" fill="#0a0a0a"/>
  <!-- Globe circle -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#33ff33" stroke-width="0.6" opacity="0.3"/>
  <!-- CRT scan lines across globe -->
  <g opacity="0.5">
    <line x1="7" y1="8" x2="25" y2="8" stroke="#33ff33" stroke-width="0.7" opacity="0.15"/>
    <line x1="5.5" y1="10" x2="26.5" y2="10" stroke="#33ff33" stroke-width="0.7" opacity="0.3"/>
    <line x1="5" y1="12" x2="27" y2="12" stroke="#33ff33" stroke-width="0.8" opacity="0.5"/>
    <line x1="5" y1="14" x2="27" y2="14" stroke="#33ff33" stroke-width="0.8" opacity="0.6"/>
    <line x1="5" y1="16" x2="27" y2="16" stroke="#33ff33" stroke-width="0.9" opacity="0.7"/>
    <line x1="5" y1="18" x2="27" y2="18" stroke="#33ff33" stroke-width="0.8" opacity="0.6"/>
    <line x1="5" y1="20" x2="27" y2="20" stroke="#33ff33" stroke-width="0.8" opacity="0.5"/>
    <line x1="5.5" y1="22" x2="26.5" y2="22" stroke="#33ff33" stroke-width="0.7" opacity="0.3"/>
    <line x1="7" y1="24" x2="25" y2="24" stroke="#33ff33" stroke-width="0.7" opacity="0.15"/>
  </g>
  <!-- Continent blobs — simplified landmasses -->
  <g fill="#33ff33" opacity="0.55">
    <!-- North America -->
    <ellipse cx="11" cy="12" rx="2.5" ry="1.8"/>
    <!-- South America -->
    <ellipse cx="13" cy="20" rx="1.5" ry="2.2"/>
    <!-- Europe/Africa -->
    <ellipse cx="18" cy="13" rx="1.5" ry="1.2"/>
    <ellipse cx="19" cy="18" rx="1.8" ry="2.5"/>
    <!-- Asia -->
    <ellipse cx="23" cy="13" rx="2.2" ry="1.8"/>
  </g>
  <!-- Glow -->
  <circle cx="16" cy="16" r="11" fill="none" stroke="#33ff33" stroke-width="1" opacity="0.12"/>
</svg>
